<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>St. Bernard Choir Practice Tracks</title>
  <style>
    :root {
      --primary: #0f172a;
      --accent: #1e40af;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --border: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --radius: 12px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
      --shadow-md: 0 4px 12px -2px rgba(0,0,0,0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      line-height: 1.5;
      padding-bottom: 3rem;
    }

    .header-banner {
      width: 100%;
      max-width: 800px;
      margin: 1.5rem auto 0 auto;
      padding: 0 1rem;
    }

    .header-banner img {
      width: 100%;
      height: auto;
      border-radius: var(--radius);
      box-shadow: var(--shadow-md);
      display: block;
    }

    .page-header {
      text-align: center;
      padding: 1.5rem 1rem 1rem 1rem;
    }

    .page-header h1 {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: -0.025em;
    }

    .page-header p {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-top: 0.25rem;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 0 1rem;
    }

    .control-panel {
      position: sticky;
      top: 0.75rem;
      z-index: 50;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.85rem;
      margin-bottom: 1.5rem;
      box-shadow: var(--shadow-md);
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .search-box {
      width: 100%;
    }

    .search-input {
      width: 100%;
      padding: 0.6rem 1rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      background: #ffffff;
    }

    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(30, 64, 175, 0.15);
    }

    .filter-container {
      display: flex;
      justify-content: center;
      gap: 0.4rem;
      flex-wrap: wrap;
    }

    .filter-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 0.35rem 0.85rem;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      transition: all 0.2s ease;
    }

    .filter-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .filter-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #ffffff;
    }

    .track-list {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .track-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.15rem;
      box-shadow: var(--shadow-sm);
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .track-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .track-card.playing {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(30, 64, 175, 0.2);
    }

    .track-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
    }

    .track-title {
      font-size: 1rem;
      font-weight: 600;
      color: var(--primary);
    }

    .tag {
      font-size: 0.68rem;
      font-weight: 700;
      padding: 0.2rem 0.55rem;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .tag-soprano { background-color: #dbeafe; color: #1e40af; }
    .tag-alto { background-color: #f3e8ff; color: #6b21a8; }
    .tag-tenor { background-color: #dcfce7; color: #166534; }
    .tag-bass { background-color: #ffedd5; color: #9a3412; }
    .tag-full { background-color: #f1f5f9; color: #475569; }

    audio {
      width: 100%;
      height: 40px;
      border-radius: 8px;
      outline: none;
    }

    .no-results {
      text-align: center;
      color: var(--text-muted);
      padding: 2rem;
      font-style: italic;
    }
  </style>
</head>
<body>

  <!-- Top Banner -->
  <div class="header-banner">
    <img src="./Media/church-and-parish-center.png" alt="St. Bernard Church & Parish Center">
  </div>

  <header class="page-header">
    <h1>Choir Practice Tracks</h1>
    <p>St. Bernard Church • North Kingstown, RI</p>
  </header>

  <main class="container">
    <!-- Sticky Search & Category Panel -->
    <div class="control-panel">
      <div class="search-box">
        <input type="text" id="searchInput" class="search-input" placeholder="Search track titles..." oninput="applyFilters()">
      </div>
      <div class="filter-container">
        <button class="filter-btn active" onclick="setCategory('all', this)">All</button>
        <button class="filter-btn" onclick="setCategory('soprano', this)">Soprano</button>
        <button class="filter-btn" onclick="setCategory('alto', this)">Alto</button>
        <button class="filter-btn" onclick="setCategory('tenor', this)">Tenor</button>
        <button class="filter-btn" onclick="setCategory('bass', this)">Bass</button>
        <button class="filter-btn" onclick="setCategory('full', this)">Full / Instrumental</button>
      </div>
    </div>

    <!-- Practice Tracks List -->
    <div id="track-list" class="track-list"></div>
  </main>

  <script>
    const fileList = [
      "African Alleluia.mp3",
      "Al ShloSha.mp3",
      "And Can It Be -Alto.mp3",
      "And Can It Be -tenor.mp3",
      "And Can It Be-soprano.mp3",
      "Angels Carol Alto.mp3",
      "Angels Carol Soprano.mp3",
      "Angels We Have Heard On High.mp3",
      "Arise My Soul Arise-soprano.mp3",
      "Arise My Soul Arise-tenor.mp3",
      "Arise my Soul-alto.mp3",
      "At the foot alto.mp3",
      "At the foot bass.mp3",
      "At the foot soprano.mp3",
      "Be Thou Thy Vision 1.mp3",
      "Blest Be The Lord.mp3",
      "Candlelight carol Soprano.mp3",
      "Celtic Song Of Farewell.mp3",
      "For God So Loved Bass.mp3",
      "For God So Loved Tenor.mp3",
      "For God so Loved Alto.mp3",
      "For God so Loved Soprano.mp3",
      "Gather The People.mp3",
      "How Beautiful - soprano.mp3",
      "How Beautiful Tenor.mp3",
      "How Beautiful alto.mp3",
      "How Beautiful-bass.mp3",
      "I Have Decided to Follow Jesus- (Instrumental).mp3",
      "May We And God Be One Soprano.mp3",
      "O Holy Night Alto 2nd.mp3",
      "O Holy Night Bass 2nd.mp3",
      "O Holy Night Sop2.mp3",
      "O Holy Night Soprano 1.mp3",
      "O Holy Night Tenor 2nd.mp3",
      "One bread  One Body.mp3",
      "Rain Down.mp3",
      "Restless Is The Heart -soprano.mp3",
      "Restless Is The Heart-Alto.mp3",
      "Restless Is The Heart-bass.mp3",
      "Restless Is The Heart-tenor.mp3",
      "Tenor BASS GABRIEL.mp3",
      "The First Nowell.mp3",
      "We Three Kings.mp3",
      "We Wait For Thee -soprano.mp3",
      "We Wait For Thee Alto.mp3",
      "We Wait For Thee Tenor.mp3",
      "With A Voice Of Singing-alto.mp3",
      "With A Voice Of Singing-bass.mp3",
      "With A Voice Of Singing-soprano.mp3",
      "With A Voice Of Singing-tenor.mp3",
      "You Alone.mp3"
    ];

    let currentCategory = 'all';
    let allTracks = [];

    function initTracks() {
      allTracks = fileList.map(filename => ({
        name: filename,
        cleanName: filename.replace(/\.mp3$/i, ''),
        category: getCategory(filename),
        path: `./Media/${encodeURIComponent(filename)}`
      }));

      renderTracks(allTracks);
    }

    function getCategory(filename) {
      const lower = filename.toLowerCase();
      if (lower.includes('soprano') || lower.includes('sop2')) return 'soprano';
      if (lower.includes('alto')) return 'alto';
      if (lower.includes('tenor')) return 'tenor';
      if (lower.includes('bass')) return 'bass';
      return 'full';
    }

    function renderTracks(tracks) {
      const container = document.getElementById('track-list');
      container.innerHTML = '';

      if (tracks.length === 0) {
        container.innerHTML = '<div class="no-results">No practice tracks match your search.</div>';
        return;
      }

      tracks.forEach(track => {
        const card = document.createElement('div');
        card.className = 'track-card';
        card.setAttribute('data-category', track.category);

        card.innerHTML = `
          <div class="track-header">
            <span class="track-title">${track.cleanName}</span>
            <span class="tag tag-${track.category}">${track.category}</span>
          </div>
          <audio controls preload="none" onplay="onTrackPlay(this)" onpause="onTrackPause(this)">
            <source src="${track.path}" type="audio/mpeg">
            Your browser does not support the audio element.
          </audio>
        `;
        container.appendChild(card);
      });
    }

    function setCategory(category, buttonEl) {
      currentCategory = category;
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      buttonEl.classList.add('active');
      applyFilters();
    }

    function applyFilters() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();

      const filtered = allTracks.filter(track => {
        const matchesCategory = (currentCategory === 'all' || track.category === currentCategory);
        const matchesQuery = track.cleanName.toLowerCase().includes(query);
        return matchesCategory && matchesQuery;
      });

      renderTracks(filtered);
    }

    function onTrackPlay(audioEl) {
      document.querySelectorAll('audio').forEach(other => {
        if (other !== audioEl) other.pause();
      });
      document.querySelectorAll('.track-card').forEach(card => card.classList.remove('playing'));
      audioEl.closest('.track-card').classList.add('playing');
    }

    function onTrackPause(audioEl) {
      audioEl.closest('.track-card').classList.remove('playing');
    }

    window.addEventListener('DOMContentLoaded', initTracks);
  </script>

</body>
</html>

</body>
</html>
