<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>St. Bernard Choir Practice Tracks</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/tracks.js" defer></script>
</head>
<body>

  <!-- Top Banner Header Graphic -->
  <div class="header-banner">
    <img src="Media/SBC.jpg" alt="St. Bernard Church Choir Header">
  </div>
<div style="text-align: center; margin: 20px 0;">
  <a href="mass-schedule.html" style="color: #2563eb; text-decoration: none; font-weight: 600; font-size: 0.95rem; display: inline-flex; align-items: center; gap: 6px;">
    📅 View Fall 2026 Mass Schedule →
  </a>
</div>

  <!-- Important Dates Section -->
<div class="important-dates-wrapper">
  <div class="important-dates-card">
    <h2 class="important-dates-title">Important Dates</h2>
    <div class="dates-list">
      
      <!-- All Souls Mass -->
      <div class="date-item" data-date="2026-11-02">
        <span class="date-col">November 2nd</span>
        <span class="time-col">8:30 AM</span>
        <span class="event-col">All Souls Mass</span>
        <span class="dress-col">Dress: White / Black</span>
      </div>

      <!-- Thanksgiving Mass -->
      <div class="date-item" data-date="2026-11-26">
        <span class="date-col">November 26th</span>
        <span class="time-col">8:30 AM</span>
        <span class="event-col">Thanksgiving Mass</span>
        <span class="dress-col"></span>
      </div>

      <!-- Christmas Mass -->
      <div class="date-item" data-date="2026-12-25">
        <span class="date-col">December 25th</span>
        <span class="time-col">TBD</span>
        <span class="event-col">Christmas Mass</span>
        <span class="dress-col"></span>
      </div>

    </div>
  </div>
</div>
<main class="container">


    <!-- 1. TOP SECTION: CURRENT 2026-27 TRACKS -->
    <section id="current-tracks-section" style="margin-bottom: 60px;">
      <div id="current-tracks-list">
        <!-- 2026-27 tracks render here automatically on page load -->
      </div>
    </section>

    <!-- 2. MIDDLE SECTION: SEARCH & FILTER CONTROLS -->
    <section id="archive-filter-section" style="padding-top: 20px; border-top: 2px dashed #cbd5e1; margin-bottom: 24px;">
      <h2 style="font-size: 1.15rem; color: #334155; margin-bottom: 12px;">Archive & Track Search</h2>
      <div class="search-container">
        <input type="text" id="searchInput" placeholder="Search track titles or composers..." oninput="applyFilters()" />

        <div class="filter-group">
          <span class="filter-label">SEASON:</span>
          <button class="filter-btn season-btn active" onclick="setSeason('all', this)">All Seasons</button>
          <button class="filter-btn season-btn" onclick="setSeason('Ordinary Time', this)">Ordinary Time</button>
          <button class="filter-btn season-btn" onclick="setSeason('Advent', this)">Advent</button>
          <button class="filter-btn season-btn" onclick="setSeason('Christmas', this)">Christmas</button>
          <button class="filter-btn season-btn" onclick="setSeason('Lent/Easter', this)">Lent/Easter</button>
        </div>

        <div class="filter-group">
          <span class="filter-label">VOICE:</span>
          <button class="filter-btn voice-btn active" onclick="setVoice('all', this)">All</button>
          <button class="filter-btn voice-btn" onclick="setVoice('soprano', this)">Soprano</button>
          <button class="filter-btn voice-btn" onclick="setVoice('alto', this)">Alto</button>
          <button class="filter-btn voice-btn" onclick="setVoice('tenor', this)">Tenor</button>
          <button class="filter-btn voice-btn" onclick="setVoice('bass', this)">Bass</button>
          <button class="filter-btn voice-btn" onclick="setVoice('full', this)">Full / Instrumental</button>
        </div>
      </div>
    </section>

    <!-- 3. BOTTOM SECTION: ARCHIVE TRACKS -->
    <section id="archive-tracks-section">
      <div id="archive-tracks-list">
        <!-- Archive songs render here -->
      </div>
    </section>
  </main>

</body>
</html>
