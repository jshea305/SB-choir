<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Track Entry Helper - St. Bernard Choir</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      max-width: 680px;
      margin: 30px auto;
      padding: 0 20px;
    }
    .card {
      background: #ffffff;
      padding: 24px;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }
    h2 { margin-top: 0; color: #1e293b; font-size: 1.25rem; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-weight: 600; font-size: 0.85rem; margin-bottom: 6px; color: #475569; }
    input[type="text"], select {
      width: 100%;
      padding: 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.95rem;
      box-sizing: border-box;
    }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .parts-box {
      background: #f1f5f9;
      padding: 14px;
      border-radius: 8px;
      margin-top: 10px;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      font-size: 0.95rem;
      margin-top: 12px;
    }
    button:hover { background: #1d4ed8; }
    textarea {
      width: 100%;
      height: 160px;
      font-family: monospace;
      font-size: 0.85rem;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      box-sizing: border-box;
      background: #0f172a;
      color: #38bdf8;
      margin-top: 12px;
    }
    .copy-btn {
      background: #16a34a;
      margin-top: 8px;
    }
    .copy-btn:hover { background: #15803d; }
  </style>
</head>
<body>

  <div class="card">
    <h2>🎵 Track JSON Entry Generator</h2>
    
    <div class="form-group">
      <label>Song Title *</label>
      <input type="text" id="title" placeholder="e.g., My Soul in Stillness Waits" oninput="generateJSON()" />
    </div>

    <div class="grid-2">
      <div class="form-group">
        <label>Composer (Optional)</label>
        <input type="text" id="composer" placeholder="e.g., Marty Haugen" oninput="generateJSON()" />
      </div>
      <div class="form-group">
        <label>Liturgical Season</label>
        <select id="season" onchange="generateJSON()">
          <option value="2026-27">2026-27 (Current)</option>
          <option value="Advent">Advent</option>
          <option value="Christmas">Christmas</option>
          <option value="Lent/Easter">Lent/Easter</option>
          <option value="Ordinary Time">Ordinary Time</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label>YouTube Link (Optional)</label>
      <input type="text" id="youtubeUrl" placeholder="https://youtu.be/..." oninput="generateJSON()" />
    </div>

    <div class="parts-box">
      <label style="margin-bottom: 8px;">Audio MP3 Filenames (Leave blank if YouTube-only)</label>
      <div class="grid-2">
        <input type="text" id="soprano" placeholder="Soprano MP3 filename" oninput="generateJSON()" />
        <input type="text" id="alto" placeholder="Alto MP3 filename" oninput="generateJSON()" />
        <input type="text" id="tenor" placeholder="Tenor MP3 filename" oninput="generateJSON()" />
        <input type="text" id="bass" placeholder="Bass MP3 filename" oninput="generateJSON()" />
      </div>
    </div>

    <button type="button" onclick="generateJSON()">Generate JSON Code</button>

    <div class="form-group" style="margin-top: 20px;">
      <label>Formatted Output (Copy & Paste before closing <code>]</code> in <code>data/tracks.json</code>):</label>
      <textarea id="jsonOutput" readonly></textarea>
      <button type="button" class="copy-btn" onclick="copyOutput()">📋 Copy Code to Clipboard</button>
    </div>
  </div>

  <script>
    function generateJSON() {
      const title = document.getElementById('title').value.trim();
      const composer = document.getElementById('composer').value.trim();
      const season = document.getElementById('season').value;
      const youtubeUrl = document.getElementById('youtubeUrl').value.trim();

      const soprano = document.getElementById('soprano').value.trim();
      const alto = document.getElementById('alto').value.trim();
      const tenor = document.getElementById('tenor').value.trim();
      const bass = document.getElementById('bass').value.trim();

      if (!title) {
        document.getElementById('jsonOutput').value = "// Enter a song title above to generate JSON...";
        return;
      }

      const trackObj = {
        title: title
      };

      if (composer) trackObj.composer = composer;
      trackObj.season = season;
      if (youtubeUrl) trackObj.youtubeUrl = youtubeUrl;

      const parts = {};
      if (soprano) parts.soprano = soprano;
      if (alto) parts.alto = alto;
      if (tenor) parts.tenor = tenor;
      if (bass) parts.bass = bass;

      if (Object.keys(parts).length > 0) {
        trackObj.parts = parts;
      }

      // Format clean JSON snippet with comma separator
      const outputText = ",\n" + JSON.stringify(trackObj, null, 2);
      document.getElementById('jsonOutput').value = outputText;
    }

    function copyOutput() {
      const textarea = document.getElementById('jsonOutput');
      textarea.select();
      document.execCommand('copy');
      alert('Copied to clipboard! Paste it right before the final ] bracket in data/tracks.json');
    }

    // Initial setup
    generateJSON();
  </script>

</body>
</html>
