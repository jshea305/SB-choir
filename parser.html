<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Single-Line Track JSON Parser</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; }
    input, select { width: 100%; padding: 10px; font-size: 1rem; box-sizing: border-box; margin-bottom: 10px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    textarea { width: 100%; height: 120px; font-family: monospace; background: #0f172a; color: #38bdf8; margin-top: 10px; padding: 10px; box-sizing: border-box; }
  </style>
</head>
<body>

  <h3>Single-Line Track JSON Parser</h3>
  <p><small>Paste file name or YouTube URL below:</small></p>

  <input type="text" id="lineInput" placeholder="e.g. Be Still Tenor.mp3" oninput="parseLine()" />

  <div class="grid">
    <div>
      <label><small>Season:</small></label>
      <select id="seasonSelect" onchange="parseLine()">
        <option value="Ordinary Time">Ordinary Time</option>
        <option value="Advent / Christmas">Advent / Christmas</option>
        <option value="Lent / Easter">Lent / Easter</option>
      </select>
    </div>
    <div>
      <label><small>Status:</small></label>
      <select id="statusSelect" onchange="parseLine()">
        <option value="archived">archived</option>
        <option value="current">current</option>
      </select>
    </div>
  </div>

  <textarea id="jsonOutput" readonly></textarea>

  <script>
    function parseLine() {
      const input = document.getElementById('lineInput').value.trim();
      const season = document.getElementById('seasonSelect').value;
      const status = document.getElementById('statusSelect').value;

      if (!input) {
        document.getElementById('jsonOutput').value = '';
        return;
      }

      const isUrl = input.startsWith('http://') || input.startsWith('https://');
      
      let title = '';
      let name = '';

      if (isUrl) {
        title = "Full Recording";
      } else {
        name = input.endsWith('.mp3') ? input : `${input}.mp3`;
        // Strip .mp3 extension to create title
        title = name.replace(/\.mp3$/i, '');
      }

      const entry = { title: title };
      
      if (name) entry.name = name;
      if (isUrl) entry.youtubeUrl = input;
      
      entry.season = season;
      entry.status = status;

      document.getElementById('jsonOutput').value = ",\n" + JSON.stringify(entry, null, 2);
    }
  </script>

</body>
</html>
