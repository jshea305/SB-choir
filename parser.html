<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Single-Line Track JSON Parser</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; }
    input { width: 100%; padding: 10px; font-size: 1rem; box-sizing: border-box; }
    textarea { width: 100%; height: 120px; font-family: monospace; background: #0f172a; color: #38bdf8; margin-top: 15px; padding: 10px; box-sizing: border-box; }
  </style>
</head>
<body>

  <h3>Single-Line Track JSON Parser</h3>
  <p><small>Format: <code>Title, MP3 Filename or YouTube URL, Season</code></small></p>

  <input type="text" id="lineInput" placeholder="Waiting In Silence, Alto Waiting In Silence.mp3, Advent / Christmas" oninput="parseLine()" />

  <textarea id="jsonOutput" readonly></textarea>

  <script>
    function parseLine() {
      const input = document.getElementById('lineInput').value.trim();
      if (!input) {
        document.getElementById('jsonOutput').value = '';
        return;
      }

      // Split by comma
      const parts = input.split(',').map(s => s.trim());
      const title = parts[0] || '';
      const target = parts[1] || '';
      const season = parts[2] || 'Ordinary Time';

      const entry = { title: title };

      // Route to youtubeUrl if it's a link, otherwise assign to name (MP3)
      if (target.startsWith('http://') || target.startsWith('https://')) {
        entry.youtubeUrl = target;
      } else if (target) {
        entry.name = target.endsWith('.mp3') ? target : `${target}.mp3`;
      }

      entry.season = season;
      entry.status = "current";

      document.getElementById('jsonOutput').value = ",\n" + JSON.stringify(entry, null, 2);
    }
  </script>

</body>
</html>
